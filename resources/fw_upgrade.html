<!DOCTYPE html>
<html>
  <head>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <script type='text/javascript' src='version.js'></script>
    <link rel='stylesheet' href='style.css' />
  </head>
  <body>
    <div class='row'>
      <div class='column'>
        <h1>ZuluControl Firmware Upgrade</h1>
      </div>
    </div>
    <div class='row'>
      <div class='column'>
        <p>
          To upgrade this firmware please upload the file <code>zulucontrol.uf2</code>.
        </p>
        <p>Current firmware version: <span id='cfv'></span></p>
        <p>
          <form id='uploadForm'>
            <label for='fileInput'>Firmware file:</label>
            <input id='fileInput' type='file' onchange='fileInputChanged(this)' />
            <input id='upgradeBtn' type='submit' value='Upgrade' disabled />
          </form>
        </p>
        <p id='progress' style='display: none'>
          <progress id='progressBar' value='0' max='100'></progress>
          <span id='progressText'>0%</span>
        </p>
      </div>
    </div>
  </body>
  <script>
    var rebootDelay = 10;

    function fileInputChanged(input) {
      document.getElementById('upgradeBtn').disabled = !input.files.length;
    }

    function rebootWait() {
      var progressText = document.getElementById('progressText');
      progressText.textContent = 'Upload complete, please wait for reboot... ' + rebootDelay;
      rebootDelay--;
      if (rebootDelay == 0) {
        document.location = '/';
      } else {
        setTimeout(rebootWait, 1000);
      }
    }

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var file = document.getElementById('fileInput').files[0];
      if (!file) return;
      document.getElementById('progress').style.display = 'block';
      var progressBar  = document.getElementById('progressBar');
      var progressText = document.getElementById('progressText');
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/fw_upgrade.cgi');
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      xhr.upload.onprogress = function(event) {
        if (event.lengthComputable) {
          var percent = Math.round((event.loaded / event.total) * 100);
          progressBar.value = percent;
          progressText.textContent = percent + '%';
        }
      };
      xhr.onload = function() {
        progressBar.value = 100;
        if (xhr.status === 200) {
          rebootWait();
        } else {
          progressText.textContent = 'Upload failed';
        }
      };
      xhr.onerror = function() {
        progressText.textContent = 'Upload error';
      };
      xhr.send(file);
    });
  </script>
</html>
